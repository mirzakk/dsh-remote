<style>

  .btn {

  .meta {

  .meta code { font-family: ui-monospace, "Cascadia Code", monospace; font-size: 11px; opacity: .8; }
  .hint { margin-top: 14px; font-size: 12px; color: var(--dim); }
</style>
</head>

<div class="card">

<script>
// TÃ¼nel adresi buradan okunur. Otomatik gÃ¼ncellenir.
const CONFIG_URL = "config.json";
const FALLBACK = null;

let tunnelUrl = null;

function setStatus(kind, text) {

async function init() {
  let cfg = null;

  // 1) config.json (Pages'e yazÄ±lmÄ±ÅŸ gÃ¼ncel tÃ¼nel)
  try {

  // 2) fallback

  if (!cfg || !cfg.url) {

  const go = document.getElementById("go");

  if (cfg.auto !== false) {
