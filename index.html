<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>DSH Remote</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #2b3648; --text: #e8ecf3;
    --muted: #93a1b5; --accent: #4c8dff; --bad: #d1464b; --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- kilit ekrani ---- */
  #lock {
    min-height: 100%; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    width: min(360px, 100%); background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 26px 24px 20px; box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .logo {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: linear-gradient(145deg, #4c8dff, #7b5cff);
    display: grid; place-items: center; font-weight: 700; font-size: 15px; color: #fff;
  }
  .brand h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .brand p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

  label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  input[type=password] {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: #0f1620; color: var(--text); font: inherit; outline: none;
  }
  input[type=password]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(76,141,255,.18); }
  .row { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; }
  .row input[type=checkbox] { accent-color: var(--accent); }
  .row span { font-size: 12px; color: var(--muted); }
  button {
    width: 100%; margin-top: 16px; padding: 11px 14px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .err { min-height: 18px; margin-top: 10px; font-size: 12px; color: var(--bad); }
  .foot { margin-top: 14px; font-size: 11px; color: #6b7889; text-align: center; }

  /* ---- uygulama ---- */
  #app { position: fixed; inset: 0; display: none; background: var(--bg); }
  #app.on { display: block; }
  #frame { width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }

  #hud {
    position: fixed; right: 12px; bottom: 12px; z-index: 5;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px; border-radius: 999px; font-size: 12px;
    background: rgba(13,17,23,.82); border: 1px solid var(--line);
    color: var(--muted); backdrop-filter: blur(8px); cursor: default;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.warn { background: #d29922; }
  .dot.bad { background: var(--bad); }

  #veil {
    position: fixed; inset: 0; z-index: 4; display: none;
    place-items: center; background: rgba(13,17,23,.86); backdrop-filter: blur(4px);
    text-align: center; padding: 24px;
  }
  #veil.on { display: grid; }
  #veil h2 { font-size: 15px; margin: 0 0 6px; font-weight: 600; }
  #veil p { margin: 0; font-size: 12px; color: var(--muted); }
  .spinner {
    width: 26px; height: 26px; margin: 0 auto 14px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.16); border-top-color: var(--accent);
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="lock">
  <form class="card" id="form" autocomplete="off">
    <div class="brand">
      <div class="logo">D</div>
      <div>
        <h1>DSH Remote</h1>
        <p>DeepSeek Harness uzaktan erişim</p>
      </div>
    </div>

    <label for="pw">Parola</label>
    <input id="pw" type="password" inputmode="text" spellcheck="false" autocomplete="current-password" placeholder="••••••••">
    <div class="row">
      <input id="remember" type="checkbox" checked>
      <span>Bu cihazda hatırla</span>
    </div>
    <button id="submit" type="submit">Giriş</button>
    <div class="err" id="err"></div>
    <div class="foot" id="foot">Tünel adresi şifreli saklanır; parola olmadan okunamaz.</div>
  </form>
</div>

<div id="app">
  <iframe id="frame" title="DeepSeek Harness" allow="clipboard-read; clipboard-write; microphone; fullscreen" referrerpolicy="no-referrer"></iframe>
  <div id="veil"><div><div class="spinner"></div><h2>Yeniden bağlanıyor…</h2><p id="veilMsg">Bağlantı kuruluyor</p></div></div>
  <div id="hud"><span class="dot" id="dot"></span><span id="hudMsg">Bağlı</span></div>
</div>

<script>
(function () {
  "use strict";

  var CONFIG_URL = "config.json";
  var STORE_KEY = "dsh.pw.v1";
  var ITER_DEFAULT = 310000;

  var host = "";          // aktif tunel host'u
  var password = null;     // cozme icin elde tutulur (config yenilenince gerekir)
  var fails = 0;

  function $(id) { return document.getElementById(id); }

  function b64ToBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function txt(s) { return new TextEncoder().encode(s); }

  async function decrypt(cfg, pw) {
    var base = await crypto.subtle.importKey("raw", txt(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64ToBytes(cfg.salt), iterations: cfg.iter || ITER_DEFAULT, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
    );
    var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(cfg.iv) }, key, b64ToBytes(cfg.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  async function loadConfig() {
    var res = await fetch(CONFIG_URL + "?_=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("config.json: HTTP " + res.status);
    return res.json();
  }

  function hostOf(url) {
    try { return new URL(url).host; } catch (e) { return ""; }
  }

  function hud(kind, text) {
    $("dot").className = "dot " + (kind || "");
    $("hudMsg").textContent = text;
  }

  function veil(on, msg) {
    $("veil").classList.toggle("on", !!on);
    if (msg) $("veilMsg").textContent = msg;
  }

  function showApp(h, target) {
    host = h;
    $("lock").style.display = "none";
    $("app").classList.add("on");
    var f = $("frame");
    // Ilk yuklemede token'li adres sart: DSH cerezi ancak token ile kurar.
    var want = target || ("https://" + h + "/");
    var cur = "";
    try { cur = new URL(f.src).host; } catch (e) {}
    if (cur !== h || !f.src) f.src = want;
    hud("", "Bağlı");
    veil(false);
    watchFrame();
  }

  // config'i tazele: tunel adi degistiyse iframe'i sessizce tasi
  async function sync() {
    try {
      var cfg = await loadConfig();
      var obj = cfg.ct ? await decrypt(cfg, password) : cfg;
      var h = hostOf(obj.url);
      if (!h) return;
      if (h !== host) { veil(true, "Yeni tünel adresi alındı"); showApp(h, obj.url); }
    } catch (e) { /* parola henuz yok ya da ag hatasi */ }
  }

  // iframe saglik takibi: tokensiz fetch YOK (401 gurultusunu onler).
  // Yalnizca iframe'in kendi load/error olaylarini dinleriz.
  var loadFails = 0;
  function watchFrame() {
    var f = $("frame");
    if (!f || f.__watching) return;
    f.__watching = true;

    f.addEventListener("load", function () {
      loadFails = 0;
      veil(false);
      hud("", "Bağlı");
    });

    f.addEventListener("error", function () {
      loadFails++;
      if (loadFails >= 2) {
        veil(true, "Sunucuya ulaşılamıyor");
        hud("bad", "Bağlantı yok");
      } else {
        hud("warn", "Yeniden deneniyor");
      }
    });
  }

  async function enter(pw) {
    var cfg = await loadConfig();
    var obj = cfg.ct ? await decrypt(cfg, pw) : cfg;
    if (!obj || !obj.url) throw new Error("yapılandırma boş");
    password = pw;
    showApp(hostOf(obj.url), obj.url);
  }

  async function boot() {
    var cfg;
    try { cfg = await loadConfig(); }
    catch (e) { $("err").textContent = "Yapılandırma okunamadı: " + e.message; return; }

    var saved = null;
    try { saved = localStorage.getItem(STORE_KEY); } catch (e) {}
    if (saved) {
      try { await enter(saved); } catch (e) {
        try { localStorage.removeItem(STORE_KEY); } catch (e2) {}
        $("foot").textContent = "Kayıtlı parola geçersiz, yeniden gir.";
      }
    }
    $("pw").focus();

    $("form").addEventListener("submit", async function (ev) {
      ev.preventDefault();
      var pw = $("pw").value;
      if (!pw) return;
      $("submit").disabled = true;
      $("err").textContent = "";
      try {
        await enter(pw);
        if ($("remember").checked) { try { localStorage.setItem(STORE_KEY, pw); } catch (e) {} }
      } catch (e) {
        $("err").textContent = "Parola yanlış veya yapılandırma bozuk.";
        $("submit").disabled = false;
        $("pw").select();
      }
    });
  }

  boot();
  setInterval(function () { if (password) sync(); }, 20000);
  watchFrame();

  // sekmeye donunce hemen kontrol et
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && password) { sync(); }
  });
})();
</script>
</body>
</html>
