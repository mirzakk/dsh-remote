<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepSeek Harness</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<style>
  :root {
    color-scheme: light dark;
    --bg: #0a0e17; --fg: #e8ecf3; --dim: #7a8699;
    --accent: #4d7cff; --ok: #2ecc71; --bad: #e74c3c; --warn: #f39c12;
    --card: #131a26; --border: #1f2937; --field: #0d131e;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f7f9fc; --fg:#111827; --dim:#6b7280; --card:#fff; --border:#e5e7eb; --field:#f3f5f9; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--fg); padding: 20px;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  .card {
    width: 100%; max-width: 460px; background: var(--card);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 30px 26px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  .head { text-align: center; margin-bottom: 22px; }
  .logo { font-size: 40px; line-height: 1; margin-bottom: 12px; }
  h1 { margin: 0 0 5px; font-size: 20px; font-weight: 650; letter-spacing: -.02em; }
  .sub { margin: 0; color: var(--dim); font-size: 13px; }

  .status {
    display: flex; align-items: center; gap: 9px;
    padding: 11px 14px; margin-bottom: 18px; border-radius: 10px;
    background: rgba(77,124,255,.1); border: 1px solid rgba(77,124,255,.25);
    font-size: 13.5px; font-weight: 550;
  }
  .status.ok { background: rgba(46,204,113,.1); border-color: rgba(46,204,113,.3); }
  .status.bad { background: rgba(231,76,60,.1); border-color: rgba(231,76,60,.3); }
  .status.warn { background: rgba(243,156,18,.1); border-color: rgba(243,156,18,.3); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  .dot.ok { background: var(--ok); animation: none; }
  .dot.bad { background: var(--bad); animation: none; }
  .dot.warn { background: var(--warn); animation: none; }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }

  label { display: block; font-size: 12.5px; color: var(--dim); margin-bottom: 6px; }
  input[type=password] {
    width: 100%; padding: 12px 14px; margin-bottom: 12px;
    background: var(--field); color: var(--fg);
    border: 1px solid var(--border); border-radius: 9px;
    font: inherit; font-size: 15px; letter-spacing: .1em;
  }
  input[type=password]:focus { outline: none; border-color: var(--accent); }

  .btn {
    display: block; width: 100%; padding: 13px 20px;
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    font: inherit; font-weight: 650; font-size: 15px; cursor: pointer;
    transition: filter .15s, transform .1s;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: scale(.985); }
  .btn:disabled { opacity: .55; cursor: default; transform: none; }
  .btn[hidden] { display: none; }

  .err { color: var(--bad); font-size: 12.5px; margin-top: 10px; min-height: 1.2em; }
  .okmsg { color: var(--ok); font-size: 12.5px; margin-top: 10px; min-height: 1.2em; }
  .remember { display: flex; align-items: center; gap: 8px; margin: 4px 0 14px; font-size: 12.5px; color: var(--dim); }
  .remember input { accent-color: var(--accent); }
  .foot { margin-top: 18px; font-size: 11.5px; color: var(--dim); text-align: center; line-height: 1.7; }
  .foot code { font-family: ui-monospace, monospace; font-size: 10.5px; }

  /* parola degistirme */
  .linkbtn {
    display: block; width: 100%; margin-top: 14px; padding: 8px;
    background: none; border: none; color: var(--dim);
    font: inherit; font-size: 12.5px; text-decoration: underline;
    cursor: pointer; text-underline-offset: 3px;
  }
  .linkbtn:hover { color: var(--accent); }
  .change { margin-top: 18px; padding-top: 20px; border-top: 1px solid var(--border); }
  .change.hidden { display: none; }
  .change h2 { margin: 0 0 16px; font-size: 15px; font-weight: 650; }
  .change .lock { display: none; }
  .change input[type=password] { margin-bottom: 12px; }
  .change .btn { margin-top: 6px; }
  .hint { color: var(--dim); font-weight: 400; }
  .btn.enter { margin-top: 4px; font-size: 15.5px; padding: 15px 20px; }
  .btn.enter[hidden] { display: none; }

  /* sohbet yonetimi */
  .sess-list { margin: 10px 0; max-height: 320px; overflow-y: auto; }
  .sess-item {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 11px; margin-bottom: 6px;
    background: var(--field); border: 1px solid var(--border);
    border-radius: 8px; font-size: 13px;
  }
  .sess-item .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess-item .d { color: var(--dim); font-size: 11px; flex: none; }
  .sess-item .x {
    flex: none; padding: 4px 9px; font-size: 12px;
    background: rgba(231,76,60,.14); color: var(--bad);
    border: 1px solid rgba(231,76,60,.35); border-radius: 6px;
    cursor: pointer; font-family: inherit;
  }
  .sess-item .x:hover { background: rgba(231,76,60,.25); }
  .sess-item .r {
    flex: none; padding: 4px 9px; font-size: 12px;
    background: rgba(46,204,113,.14); color: var(--ok);
    border: 1px solid rgba(46,204,113,.35); border-radius: 6px;
    cursor: pointer; font-family: inherit;
  }
  .sess-item .r:hover { background: rgba(46,204,113,.25); }
  .empty { color: var(--dim); font-size: 12.5px; padding: 10px 0; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="logo">🧠</div>
    <h1>DeepSeek Harness</h1>
    <p class="sub">Uzak erişim</p>
  </div>

  <div class="status" id="status">
    <span class="dot" id="dot"></span>
    <span id="msg">Hazır</span>
  </div>

  <form id="form" autocomplete="off">
    <label for="pw">Erişim parolası</label>
    <input id="pw" type="password" inputmode="text" spellcheck="false" autocomplete="current-password" placeholder="••••••••">
    <div class="remember">
      <input id="remember" type="checkbox" checked>
      <label for="remember" style="margin:0">Bu cihazda hatırla</label>
    </div>
    <button class="btn" id="submit" type="submit">Giriş</button>
    <div class="err" id="err"></div>
  </form>

  <button class="linkbtn" id="toggle-change" type="button">Parolayı değiştir</button>
  <button class="linkbtn" id="toggle-sessions" type="button">Sohbetleri yönet</button>
  <a class="btn enter" id="enter" href="#" hidden>Siteye Gir →</a>

  <div class="change hidden" id="sessions">
    <h2>Sohbetler</h2>
    <div class="sess-list" id="sess-list">Yükleniyor…</div>
    <div class="trash-head" id="trash-head" hidden>
      <h2 style="margin-top:18px">Çöp kutusu</h2>
      <div class="sess-list" id="trash-list"></div>
    </div>
    <button class="linkbtn" id="close-sessions" type="button">Kapat</button>
  </div>

  <div class="change hidden" id="change">
    <div class="lock"></div>
    <h2>Parola değiştir</h2>
    <form id="change-form" autocomplete="off">
      <label for="oldpw">Mevcut parola</label>
      <input id="oldpw" type="password" spellcheck="false" autocomplete="current-password" placeholder="••••••••">

      <label for="newpw">Yeni parola <span class="hint">(en az 6 karakter)</span></label>
      <input id="newpw" type="password" spellcheck="false" autocomplete="new-password" placeholder="••••••••">

      <label for="newpw2">Yeni parola (tekrar)</label>
      <input id="newpw2" type="password" spellcheck="false" autocomplete="new-password" placeholder="••••••••">

      <button class="btn" id="change-btn" type="submit">Değiştir</button>
      <div class="err" id="change-err"></div>
    </form>
    <button class="linkbtn" id="cancel-change" type="button">Vazgeç</button>
  </div>

  <div class="foot" id="foot">
    Tünel adresi şifreli saklanır. Parola olmadan okunamaz.
  </div>
</div>

<script>
(function () {
  "use strict";

  var CONFIG_URL = "config.json";
  var STORE_KEY = "dsh.pw.v1";
  var ITER_DEFAULT = 310000;

  var $ = function (id) { return document.getElementById(id); };

  function setStatus(kind, text) {
    $("status").className = "status " + (kind || "");
    $("dot").className = "dot " + (kind || "");
    $("msg").textContent = text;
  }

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function enc(s) { return new TextEncoder().encode(s); }

  async function decrypt(cfg, password) {
    var baseKey = await crypto.subtle.importKey(
      "raw", enc(password), "PBKDF2", false, ["deriveKey"]
    );
    var aesKey = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64ToBytes(cfg.salt), iterations: cfg.iter || ITER_DEFAULT, hash: "SHA-256" },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    var pt = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(cfg.iv) },
      aesKey,
      b64ToBytes(cfg.ct)
    );
    return JSON.parse(new TextDecoder().decode(pt));
  }

  async function loadConfig() {
    var url = CONFIG_URL + "?_=" + Date.now();
    var res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("config.json: HTTP " + res.status);
    return res.json();
  }

  function go(target) {
    setStatus("ok", "Yönlendiriliyor…");
    setTimeout(function () { location.replace(target); }, 150);
  }

  // Cozer, kaydeder, ama YONLENDIRMEZ. Butonu acar.
  async function unlock(cfg, password) {
    var obj = await decrypt(cfg, password);
    if (!obj || !obj.url) throw new Error("boş yapı");
    if ($("remember").checked) {
      try { localStorage.setItem(STORE_KEY, password); } catch (e) {}
    }
    return obj.url;
  }

  function showEnter(url) {
    var b = $("enter");
    b.href = url;
    b.hidden = false;
    b.onclick = function () { setStatus("ok", "Giriş yapılıyor…"); };
    var f = $("form");
    if (f) f.style.display = "none";
    var tc = $("toggle-change");
    if (tc) tc.style.display = "block";
    $("foot").innerHTML = "Parola doğrulandı. Siteye girmek için butona bas.";
    setStatus("ok", "Hazır");
  }

  async function start() {
    setStatus("", "Yapılandırma okunuyor…");

    var cfg;
    try {
      cfg = await loadConfig();
    } catch (e) {
      setStatus("bad", "Yapılandırma okunamadı");
      $("err").textContent = e.message;
      return;
    }

    // Sifresiz (eski) format: dogrudan goster
    if (!cfg.ct) {
      if (cfg.url) { showEnter(cfg.url); return; }
      setStatus("bad", "Yapılandırma boş");
      return;
    }

    setStatus("", "Parola gerekli");

    // Bu cihazda kayitli parola var mi? Coz ama YONLENDIRME.
    var saved = null;
    try { saved = localStorage.getItem(STORE_KEY); } catch (e) {}

    if (saved) {
      setStatus("", "Kayıtlı parola doğrulanıyor…");
      try {
        var savedUrl = await unlock(cfg, saved);
        showEnter(savedUrl);
        return;
      } catch (e) {
        try { localStorage.removeItem(STORE_KEY); } catch (e2) {}
        setStatus("warn", "Kayıtlı parola geçersiz");
      }
    }

    $("pw").focus();
    $("form").addEventListener("submit", async function (ev) {
      ev.preventDefault();
      var pw = $("pw").value;
      if (!pw) return;
      $("submit").disabled = true;
      $("err").textContent = "";
      setStatus("", "Çözülüyor…");
      try {
        var u = await unlock(cfg, pw);
        $("submit").disabled = false;
        showEnter(u);
      } catch (e) {
        setStatus("bad", "Parola yanlış");
        $("err").textContent = "Parola yanlış veya yapılandırma bozuk.";
        $("submit").disabled = false;
        $("pw").select();
      }
    });
  }

  // ---- Parola degistirme -------------------------------------------------

  // Parola degistirme servisi: passwd.json'dan okunur (tunel adresi degisebilir)
  var CHANGE_ENDPOINT = "";

  async function loadEndpoint() {
    try {
      var r = await fetch("passwd.json?_=" + Date.now(), { cache: "no-store" });
      if (!r.ok) return;
      var j = await r.json();
      if (j && j.endpoint) CHANGE_ENDPOINT = j.endpoint;
    } catch (e) {
      /* servis kapali olabilir - sessiz gec */
    }
  }

  function showChange(on) {
    $("change").classList.toggle("hidden", !on);
    $("toggle-change").style.display = on ? "none" : "block";
    if (on) {
      $("change-err").textContent = "";
      $("oldpw").focus();
    }
  }

  function wireChange() {
    $("toggle-change").addEventListener("click", function () { showChange(true); });
    $("cancel-change").addEventListener("click", function () {
      showChange(false);
      $("oldpw").value = $("newpw").value = $("newpw2").value = "";
      $("change-err").textContent = "";
    });

    $("change-form").addEventListener("submit", async function (ev) {
      ev.preventDefault();
      var err = $("change-err");
      err.textContent = "";

      var oldPw = $("oldpw").value;
      var a = $("newpw").value;
      var b = $("newpw2").value;

      if (!oldPw) { err.textContent = "Mevcut parolayı gir."; return; }
      if (a.length < 6) { err.textContent = "Yeni parola en az 6 karakter olmalı."; return; }
      if (a !== b) { err.textContent = "Yeni parolalar eşleşmiyor."; return; }
      if (a === oldPw) { err.textContent = "Yeni parola mevcutla aynı."; return; }

      if (!CHANGE_ENDPOINT) {
        err.textContent = "Parola servisi yapılandırılmamış. Yerel sunucuyu başlat.";
        return;
      }

      $("change-btn").disabled = true;
      $("change-btn").textContent = "Değiştiriliyor…";

      try {
        var res = await fetch(CHANGE_ENDPOINT + "/change", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ oldPassword: oldPw, newPassword: a }),
        });
        var out = await res.json().catch(function () { return {}; });

        if (!res.ok) {
          err.textContent = out.error || ("Hata: HTTP " + res.status);
          return;
        }

        // Basarili: kayitli parolayi guncelle
        try { localStorage.setItem(STORE_KEY, a); } catch (e) {}

        $("change-form").innerHTML =
          '<div class="okmsg">Parola değiştirildi. Yeni parolayı kullan.</div>';
        setTimeout(function () { showChange(false); }, 2200);
      } catch (e) {
        err.textContent = "Servise ulaşılamadı: " + e.message;
      } finally {
        $("change-btn").disabled = false;
        $("change-btn").textContent = "Değiştir";
      }
    });
  }

  // ---- Sohbet yonetimi ---------------------------------------------------

  var DELETE_ENDPOINT = "";

  async function loadDeleteEndpoint() {
    try {
      var r = await fetch("delete.json?_=" + Date.now(), { cache: "no-store" });
      if (!r.ok) return;
      var j = await r.json();
      if (j && j.endpoint) DELETE_ENDPOINT = j.endpoint;
    } catch (e) {}
  }

  // --- Realtime ayna: dosya degisince listeyi tazele ---
  var MIRROR_ENDPOINT = "";

  async function loadMirrorEndpoint() {
    try {
      var r = await fetch("mirror.json?_=" + Date.now(), { cache: "no-store" });
      if (!r.ok) return;
      var j = await r.json();
      if (j && j.endpoint) MIRROR_ENDPOINT = j.endpoint;
    } catch (e) {}
  }

  function startMirror() {
    if (!MIRROR_ENDPOINT) return;
    try {
      var es = new EventSource(MIRROR_ENDPOINT + "/events");
      var t = null;
      var kick = function () {
        if (t) clearTimeout(t);
        t = setTimeout(function () {
          // Sohbet paneli aciksa yenile
          if (!$("sessions").classList.contains("hidden")) refreshSessions();
        }, 500);
      };
      es.addEventListener("workspace", kick);
      es.addEventListener("sessions", kick);
      es.onerror = function () {
        // Baglanti koptu; 10 sn sonra tekrar dene
        try { es.close(); } catch (e) {}
        setTimeout(startMirror, 10000);
      };
    } catch (e) {}
  }

  function sessRow(title, sub, actions) {
    var row = document.createElement("div");
    row.className = "sess-item";
    var t = document.createElement("span");
    t.className = "t";
    t.textContent = title;
    row.appendChild(t);
    if (sub) {
      var d = document.createElement("span");
      d.className = "d";
      d.textContent = sub;
      row.appendChild(d);
    }
    for (var i = 0; i < actions.length; i++) row.appendChild(actions[i]);
    return row;
  }

  async function refreshSessions() {
    var listEl = $("sess-list");
    listEl.innerHTML = "Yükleniyor…";

    if (!DELETE_ENDPOINT) {
      listEl.innerHTML = '<div class="empty">Silme servisi kapalı.</div>';
      return;
    }

    var data;
    try {
      var r = await fetch(DELETE_ENDPOINT + "/sessions?t=" + Date.now(), { cache: "no-store" });
      data = await r.json();
    } catch (e) {
      listEl.innerHTML = '<div class="empty">Servise ulaşılamadı.</div>';
      return;
    }

    listEl.innerHTML = "";
    var items = (data && data.items) || [];
    if (!items.length) {
      listEl.innerHTML = '<div class="empty">Sohbet yok.</div>';
    }

    items.forEach(function (it) {
      var del = document.createElement("button");
      del.className = "x";
      del.type = "button";
      del.textContent = "Sil";
      del.onclick = function () { doDelete(it, del); };

      var when = it.updatedAt ? new Date(it.updatedAt).toLocaleString("tr-TR") : "";
      listEl.appendChild(sessRow(it.title || it.sessionId.slice(0, 12), when, [del]));
    });

    // Cop kutusu
    var trashData = { items: [] };
    try {
      var tr = await fetch(DELETE_ENDPOINT + "/trash?t=" + Date.now(), { cache: "no-store" });
      trashData = await tr.json();
    } catch (e) {}

    var trashItems = (trashData && trashData.items) || [];
    $("trash-head").hidden = trashItems.length === 0;
    var tl = $("trash-list");
    tl.innerHTML = "";
    trashItems.forEach(function (it) {
      var rest = document.createElement("button");
      rest.className = "r";
      rest.type = "button";
      rest.textContent = "Geri al";
      rest.onclick = function () { doRestore(it, rest); };
      var when = it.deletedAt ? new Date(it.deletedAt).toLocaleString("tr-TR") : "";
      tl.appendChild(sessRow(it.sessionId.slice(0, 18) + "…", when, [rest]));
    });
  }

  async function doDelete(it, btn) {
    var name = it.title || it.sessionId;
    if (!confirm('"' + name + '" silinsin mi?\n\nÇöp kutusuna taşınır, geri alabilirsin.')) return;

    btn.disabled = true;
    btn.textContent = "…";
    try {
      var r = await fetch(DELETE_ENDPOINT + "/delete", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ sessionId: it.sessionId, confirm: true }),
      });
      var j = await r.json().catch(function () { return {}; });
      if (!r.ok) {
        alert("Silinemedi: " + (j.error || r.status));
        btn.disabled = false;
        btn.textContent = "Sil";
        return;
      }
      refreshSessions();
    } catch (e) {
      alert("Servise ulaşılamadı: " + e.message);
      btn.disabled = false;
      btn.textContent = "Sil";
    }
  }

  async function doRestore(it, btn) {
    btn.disabled = true;
    btn.textContent = "…";
    try {
      var r = await fetch(DELETE_ENDPOINT + "/restore", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ trashId: it.trashId }),
      });
      if (!r.ok) {
        var j = await r.json().catch(function () { return {}; });
        alert("Geri alınamadı: " + (j.error || r.status));
      }
      refreshSessions();
    } catch (e) {
      alert("Servise ulaşılamadı: " + e.message);
    }
  }

  function wireSessions() {
    $("toggle-sessions").addEventListener("click", function () {
      var box = $("sessions");
      var show = box.classList.contains("hidden");
      box.classList.toggle("hidden", !show);
      $("toggle-sessions").style.display = show ? "none" : "block";
      if (show) refreshSessions();
    });
    $("close-sessions").addEventListener("click", function () {
      $("sessions").classList.add("hidden");
      $("toggle-sessions").style.display = "block";
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () {
      wireChange();
      wireSessions();
      loadEndpoint();
      loadDeleteEndpoint();
      loadMirrorEndpoint().then(startMirror);
      start();
    });
  } else {
    wireChange();
    wireSessions();
    loadEndpoint();
    loadDeleteEndpoint();
    loadMirrorEndpoint().then(startMirror);
    start();
  }
})();
</script>
</body>
</html>
