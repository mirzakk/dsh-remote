<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>DeepSeek Harness</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<style>
  :root {
    color-scheme: light dark;
    --bg: #0a0e17; --fg: #e8ecf3; --dim: #7a8699;
    --accent: #4d7cff; --ok: #2ecc71; --bad: #e74c3c; --warn: #f39c12;
    --card: #131a26; --border: #1f2937;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f7f9fc; --fg:#111827; --dim:#6b7280; --card:#fff; --border:#e5e7eb; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--fg); padding: 20px;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  .card {
    width: 100%; max-width: 520px; background: var(--card);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 30px 26px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  .head { text-align: center; margin-bottom: 22px; }
  .logo { font-size: 40px; line-height: 1; margin-bottom: 12px; }
  h1 { margin: 0 0 5px; font-size: 20px; font-weight: 650; letter-spacing: -.02em; }
  .sub { margin: 0; color: var(--dim); font-size: 13px; }

  .status {
    display: flex; align-items: center; gap: 9px;
    padding: 11px 14px; margin-bottom: 18px; border-radius: 10px;
    background: rgba(77,124,255,.1); border: 1px solid rgba(77,124,255,.25);
    font-size: 13.5px; font-weight: 550;
  }
  .status.ok { background: rgba(46,204,113,.1); border-color: rgba(46,204,113,.3); }
  .status.bad { background: rgba(231,76,60,.1); border-color: rgba(231,76,60,.3); }
  .status.warn { background: rgba(243,156,18,.1); border-color: rgba(243,156,18,.3); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  .dot.ok { background: var(--ok); animation: none; }
  .dot.bad { background: var(--bad); animation: none; }
  .dot.warn { background: var(--warn); animation: none; }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }

  .btn {
    display: block; width: 100%; padding: 14px 20px; margin-bottom: 10px;
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    font: inherit; font-weight: 650; font-size: 15px; text-decoration: none;
    text-align: center; cursor: pointer; transition: filter .15s, transform .1s;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: scale(.985); }
  .btn[hidden] { display: none; }
  .btn.ghost {
    background: transparent; color: var(--fg);
    border: 1px solid var(--border); font-weight: 550; font-size: 13.5px;
    padding: 10px 16px;
  }

  .box {
    margin-top: 18px; padding: 14px; border-radius: 10px;
    background: rgba(127,127,127,.06); border: 1px solid var(--border);
    font-size: 12px; line-height: 1.75; color: var(--dim);
  }
  .box.hidden { display: none; }
  .box b { color: var(--fg); font-weight: 600; }
  .urlbox {
    display: block; width: 100%; margin-top: 8px; padding: 9px 11px;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 7px;
    font-family: ui-monospace, "Cascadia Code", monospace; font-size: 10.5px;
    word-break: break-all; resize: none; line-height: 1.5;
  }
  .diag { margin-top: 16px; font-size: 11.5px; color: var(--dim); }
  .diag summary { cursor: pointer; user-select: none; }
  .diag pre {
    margin: 8px 0 0; padding: 10px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 7px;
    font-size: 10.5px; line-height: 1.6; overflow-x: auto; white-space: pre-wrap; word-break: break-all;
  }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="logo">🧠</div>
    <h1>DeepSeek Harness</h1>
    <p class="sub">Uzak erişim</p>
  </div>

  <div class="status" id="status">
    <span class="dot" id="dot"></span>
    <span id="msg">Tünel aranıyor…</span>
  </div>

  <a class="btn" id="go" href="#" hidden>Siteye Gir →</a>
  <button class="btn ghost" id="auto" hidden type="button">Otomatik yönlendir</button>

  <div class="box hidden" id="manual">
    <b>Otomatik yönlendirme çalışmadıysa</b><br>
    Aşağıdaki adresi kopyalayıp tarayıcının adres çubuğuna yapıştır:
    <textarea class="urlbox" id="url" readonly rows="3"></textarea>
  </div>

  <details class="diag">
    <summary>Teşhis bilgisi</summary>
    <pre id="diag">yükleniyor…</pre>
  </details>
</div>

<script>
(function () {
  "use strict";

  var CONFIG_URL = "config.json";
  var log = [];
  function trace(s) {
    log.push(new Date().toISOString().slice(11, 19) + "  " + s);
    var d = document.getElementById("diag");
    if (d) d.textContent = log.join("\n");
  }

  function setStatus(kind, text) {
    var st = document.getElementById("status");
    st.className = "status " + (kind || "");
    document.getElementById("dot").className = "dot " + (kind || "");
    document.getElementById("msg").textContent = text;
  }

  trace("sayfa yuklendi: " + location.href);

  function showManual(u) {
    document.getElementById("manual").classList.remove("hidden");
    document.getElementById("url").value = u;
  }

  // config.json oku - cache'i kesinlikle atla
  function loadConfig() {
    var url = CONFIG_URL + "?_=" + Date.now() + "_" + Math.random().toString(36).slice(2);
    trace("config istegi: " + url);
    return fetch(url, { cache: "no-store", headers: { "Cache-Control": "no-cache" } })
      .then(function (res) {
        trace("config yaniti: HTTP " + res.status);
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (cfg) {
        trace("config alindi: " + JSON.stringify(cfg).slice(0, 160));
        return cfg;
      });
  }

  function main() {
    setStatus("", "Tünel aranıyor…");
    trace("tarayici: " + navigator.userAgent.slice(0, 80));

    loadConfig()
      .then(function (cfg) {
        if (!cfg || !cfg.url) {
          setStatus("bad", "Tünel kapalı");
          trace("HATA: config.json icinde url yok");
          return;
        }

        var target = cfg.url;
        trace("hedef: " + target.slice(0, 90));

        var ageMin = cfg.updated
          ? (Date.now() - new Date(cfg.updated).getTime()) / 60000
          : 0;
        trace("config yasi: " + ageMin.toFixed(1) + " dk");

        // NOT: Tunel icin on-kontrol (probe) YAPILMAZ.
        // Pages (github.io) -> tunnel (trycloudflare.com) arasi fetch CORS'a takilir
        // ve basarisiz probe yonlendirmeyi iptal ederdi. Navigasyon CORS'a tabi degil,
        // bu yuzden dogrudan yonlendiriyoruz.

        if (ageMin > 120) {
          trace("UYARI: config " + Math.round(ageMin) + " dk once guncellenmis");
        }

        var go = document.getElementById("go");
        go.href = target;
        go.hidden = false;
        showManual(target);

        var btn = document.getElementById("auto");
        btn.hidden = false;
        btn.onclick = function () { trace("buton: yonlendiriliyor"); location.href = target; };

        // Otomatik yonlendirme - her kosulda
        if (cfg.auto !== false) {
          setStatus("ok", "Yönlendiriliyor…");
          trace("location.replace cagriliyor");
          setTimeout(function () {
            try {
              location.replace(target);
              trace("location.replace calisti");
            } catch (e) {
              trace("replace HATA: " + e.message);
              setStatus("warn", "Yönlendirme engellendi — butonu kullan");
              btn.classList.remove("hidden");
            }
          }, 250);
        } else {
          setStatus("ok", "Tünel hazır");
        }
      })
      .catch(function (e) {
        setStatus("bad", "config.json okunamadı");
        trace("HATA: " + e.message);
      });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", main);
  } else {
    main();
  }
})();
</script>
</body>
</html>
